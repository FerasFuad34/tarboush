version: '3.9'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: tarboush_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./backend/app:/app/app
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=sqlite:///./storage/tarboush.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  celery_worker:
    build: ./backend
    container_name: tarboush_worker
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./backend/app:/app/app
    depends_on:
      - redis
      - backend
    environment:
      - DATABASE_URL=sqlite:///./storage/tarboush.db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - PYTHONUNBUFFERED=1
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=info --concurrency=2
    restart: unless-stopped

  flower:
    build: ./backend
    container_name: tarboush_flower
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis
      - celery_worker
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    command: celery -A app.workers.celery_app.celery_app flower --port=5555
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: tarboush_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    environment:
      - VITE_API_URL=http://localhost:8000
    restart: unless-stopped

volumes:
  redis_data:
